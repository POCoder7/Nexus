name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-tests:
    name: Database migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and pgTAP tests
        run: ./scripts/db-test.sh

  api:
    name: API build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: services/mdm-api
        run: ./mvnw -B verify
